name: Haven
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Haven:
    type: application
    platform: iOS
    sources: [Haven]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.haven
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Haven
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Share your location with chosen contacts for alerts, or with your family controller when you enable family sharing.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: When you enable family sharing, allow location updates and movement-based recovery while Haven is not open. You can stop sharing in Haven or iOS Settings.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Haven-Info.plist
      properties:
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.haven.location-refresh]
