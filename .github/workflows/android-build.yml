name: Build Android test package
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy APK to release package
        run: |
          mkdir -p package
          cp android/app/build/outputs/apk/debug/app-debug.apk package/Notes.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Android-Package
          path: package/Notes.apk
          retention-days: 7
          if-no-files-found: error
