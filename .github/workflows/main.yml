name: Build iPhone test package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for a physical iPhone without distribution signing
        run: >-
          xcodebuild -project ios/Haven.xcodeproj -scheme Haven
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package for local signing by AltStore
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Haven.app package/Payload/
          cd package
          zip -qry Haven-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-iPhone-test-package
          path: package/Haven-unsigned.ipa
          retention-days: 3
          if-no-files-found: error
