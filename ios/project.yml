name: Haven
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Haven:
    type: application
    platform: iOS
    sources: [Haven]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.notes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notes
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Used for location-based note reminders and trusted family sharing when enabled.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: When family sharing is enabled, allow location updates and movement-based recovery while the app is in the background. You can pause or stop sharing anytime in settings.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Haven-Info.plist
      properties:
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.notes.location-refresh]
